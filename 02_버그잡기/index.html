<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리WON뱅킹</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">  
  <h1>우리WON뱅킹</h1>

  <section class="card">
    <h2>내 계좌</h2>
    <div class="account-owner">김연지님의 입출금 계좌</div>
    <div class="account-no">1002-345-6****1</div>
    <div id="balance" class="balance-amount">-</div>
    <button id="depositBtn" class="btn">입금 10,000원</button>
  </section>

  <section class="card">
    <h2>이자 계산</h2>
    <p class="desc">우대금리 연 1.75%를 적용해 이자를 계산합니다.</p>
    <button id="interestBtn" class="btn">이자 계산하기</button>
    <div id="interestResult" class="result"></div>
  </section>

  <section class="card">
    <h2>오늘의 환율</h2>
    <div>1 USD = <span id="exchangeRate">불러오는 중...</span></div>
  </section>

  <section class="card">
    <h2>이체</h2>
    <button id="transferBtn" class="btn">이체 확인</button>
  </section>

  <section id="accountList" class="card"></section>
  <section id="categorySummary" class="card"></section>
  <section id="transactionList" class="card"></section>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div id="transferModal" class="modal">
    <h2>이체 확인</h2>
    <p>박집주인님에게 320,000원을 이체합니다.</p>
    <div class="modal-actions">
      <button id="confirmTransferBtn" class="btn">확인</button>
      <button id="closeModalBtn" class="btn btn-outline">취소</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
